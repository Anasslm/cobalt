name: Cobalt CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  simulation:
    name: RTL Simulation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            autoconf \
            flex \
            bison \
            gcc \
            g++ \
            python3 \
            python3-pip \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf
      - name: Debug runner
        uses: mxschmitt/action-tmate@v3      
      - name: Install Verilator 5.032
        run: |
          git clone --depth 1 --branch v5.032 \
            https://github.com/verilator/verilator.git \
            verilator

          cd verilator
          autoconf
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Show tool versions
        run: |
          git --version
          python3 --version
          verilator --version
          gcc --version
          riscv64-unknown-elf-gcc --version

      - name: Run Cobalt simulation
        run: |
          chmod +x scripts/cobalt.py
          python3 scripts/cobalt.py run